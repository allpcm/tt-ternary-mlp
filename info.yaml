# Tiny Tapeout project information
project:
  title:        "Ternary MLP Inference Tile"
  author:       "Phillip Moore"
  discord:      ""
  description:  "Weight-stationary ternary-weight neural network inference engine with all weights resident on-chip. No multiplier, no runtime scheduler, fixed 26-cycle latency."
  language:     "Verilog"
  clock_hz:     50000000

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "2x2"

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_pcm_ternary_mlp"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "tt_um_pcm_ternary_mlp.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "activation byte bit 0"
  ui[1]: "activation byte bit 1"
  ui[2]: "activation byte bit 2"
  ui[3]: "activation byte bit 3"
  ui[4]: "activation byte bit 4"
  ui[5]: "activation byte bit 5"
  ui[6]: "activation byte bit 6"
  ui[7]: "activation byte bit 7"

  # Outputs
  uo[0]: "7-seg segment a"
  uo[1]: "7-seg segment b"
  uo[2]: "7-seg segment c"
  uo[3]: "7-seg segment d"
  uo[4]: "7-seg segment e"
  uo[5]: "7-seg segment f"
  uo[6]: "7-seg segment g"
  uo[7]: "done"

  # Bidirectional pins
  uio[0]: "weight shift enable (in)"
  uio[1]: "weight serial data (in)"
  uio[2]: "start inference (in)"
  uio[3]: "activation load enable (in)"
  uio[4]: "busy (out)"
  uio[5]: "done (out)"
  uio[6]: "predicted class bit 0 (out)"
  uio[7]: "predicted class bit 1 (out)"

# Do not change!
yaml_version: 6
